limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=50r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend static chunks (bypasses Node.js)
    location /_next/static/ {
        alias /home/webadmin/apps/staging/b2c-nextjs-pwa/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Frontend public assets (favicon, images, etc.)
    location /public/ {
        alias /home/webadmin/apps/staging/b2c-nextjs-pwa/public/;
        expires 30d;
        access_log off;
    }

    # Proxy root UI traffic to Next.js Frontend (Port 3000)
    location / {
        limit_req zone=frontend_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}